# Public wiki site (GitHub Pages), built by .github/workflows/site.yml.
# Only the pages listed in "nav" are published: the universe and the rules.
# The pages for races, items, places, enemies, the GM guide and
# the Notion archives stay in the repo for the GM (see publication/hooks.py).
site_name: Leave no one behind
site_description: L'univers et les règles du jeu de rôle Leave no one behind
site_url: https://narxis.github.io/Leave-no-one-behind-Wiki/

# The site's home page; the other pages are read from the repo root
docs_dir: publication/accueil
site_dir: _site

theme:
  name: material
  language: fr
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Mode clair
  icon:
    logo: material/rocket-launch

plugins:
  - search:
      lang: fr

hooks:
  - publication/hooks.py

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - toc:
      permalink: true

validation:
  links:
    anchors: warn

watch:
  - lore
  - regles
  - glossaire.md
  - publication

nav:
  - Accueil: index.md
  - L'univers:
      - L'univers: lore/univers.md
      - Le PLUGS: lore/vaisseau-plugs.md
      - Les systèmes stellaires: lore/systemes-stellaires.md
      - Organisations: lore/organisations.md
      - Personnages: lore/personnages.md
      - Glossaire: glossaire.md
  - Les règles:
      - Déroulement d'une partie: regles/deroulement.md
      - Création de personnage: regles/creation-personnage.md
      - Combat: regles/combat.md
      - Statuts: regles/statuts.md
      - Cartes et deck: regles/cartes-et-deck.md
      - Score: regles/score.md
      - Artisanat: regles/artisanat.md
