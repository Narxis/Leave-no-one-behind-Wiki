# Publishes the wiki site (universe and rules) on GitHub Pages.
# To enable once: Settings → Pages → Source: GitHub Actions.
name: Site du wiki

on:
  push:
    branches: [main]
    paths:
      - 'lore/**'
      - 'regles/**'
      - 'glossaire.md'
      - 'mkdocs.yml'
      - 'publication/**'
      - '.github/workflows/site.yml'
  # Manual run (Actions tab), or from the tables action
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r publication/requirements.txt
      - run: mkdocs build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
